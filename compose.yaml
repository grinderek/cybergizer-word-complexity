name: cybergizer-word-complexity

x-app: &app
  build: .
  image: cybergizer-word-complexity:local
  environment:
    RAILS_ENV: development
    RAILS_LOG_TO_STDOUT: "1"
    REDIS_URL: redis://redis:6379/0
    PGHOST: postgres
    PGUSER: word_complexity
    PGPASSWORD: word_complexity
    DATAMUSE_URL: ${DATAMUSE_URL:-https://api.datamuse.com}
    DATAMUSE_TIMEOUT_SECONDS: ${DATAMUSE_TIMEOUT_SECONDS:-5}
    SIDEKIQ_CONCURRENCY: ${SIDEKIQ_CONCURRENCY:-3}
    WORD_CONCURRENCY: ${WORD_CONCURRENCY:-3}
  volumes:
    - .:/app
  depends_on: &app_dependencies
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  prepare:
    <<: *app
    command: ["bin/rails", "db:prepare"]

  api:
    <<: *app
    depends_on:
      <<: *app_dependencies
      prepare:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit(Net::HTTP.get_response(URI('http://127.0.0.1:3000/up')).code == '200' ? 0 : 1)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  worker:
    <<: *app
    depends_on:
      <<: *app_dependencies
      prepare:
        condition: service_completed_successfully
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: word_complexity
      POSTGRES_PASSWORD: word_complexity
      POSTGRES_DB: word_complexity_development
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U word_complexity -d word_complexity_development"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
  postgres-data:
